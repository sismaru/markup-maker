<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markup Maker - Excel to HTML Converter</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>
    <div class="app-container">
        <!-- Top Bar: Settings & Actions -->
        <header class="top-bar">
            <div class="logo-area">
                <h1>Markup Maker</h1>
            </div>

            <div class="settings-area">
                <div class="input-group">
                    <label>이미지경로1</label>
                    <input type="text" id="imagePattern1" placeholder="...brd{U1}.jpg"
                        value="../resource/20260119/pc_event_brd{U1}.jpg">
                </div>
                <div class="input-group">
                    <label>이미지경로2</label>
                    <input type="text" id="imagePattern2" placeholder="...brd{U1}_prd{U2}.jpg"
                        value="../resource/20260119/pc_event_brd{U1}_prd{U2}.jpg">
                </div>
            </div>

            <div class="actions-area">
                <!-- <button id="btnHistory" class="btn btn-secondary">히스토리</button>
                <button id="btnClear" class="btn btn-secondary">초기화</button> -->
                <button id="btnConvert" class="btn btn-primary">변환하기 (Convert)</button>
            </div>
        </header>

        <!-- Main Content: Split View -->
        <main class="split-view">
            <!-- Left Panel: Template Editor & Excel Parser -->
            <section class="panel left-panel">
                <div class="template-editor-section">
                    <div class="panel-header">
                        <h2>HTML Template</h2>
                        <div class="template-selector-container" id="templateSelector">
                            <div class="template-list-scroll">
                                <label class="custom-template-label"><input type="radio" name="templateType" value="default" checked> 기본 (Default)</label>
                                <span id="customTemplatesList" class="custom-templates-list"></span>
                            </div>
                            <button type="button" id="btnAddTemplate" class="btn-add-template" title="새 템플릿 추가">+</button>
                        </div>
                    </div>
                    <div class="editor-container">
                        <textarea id="templateInput" placeholder="여기에 HTML 템플릿을 입력하세요."><!-- 브랜드 01부터 오름차순 -->
<div class="swiper-slide">
	<div class="md_brandSet_img">
		<img src="{{이미지경로1}}" alt="">
		<a href="{{data_2}}" class="md_brandPrd_link">BRAND SHOP</a>
	</div>
	<!-- 대표상품 -->
	<ul class="md_prdList">
		<!-- 대표상품1 -->
		<li>
			<a href="/product/{{data_4}}/detail" class="md_prd_link">
				<div class="md_prd_img">
					<img src="{{이미지경로2}}" alt="">
				</div>
				<div class="md_prd_info">
					<span class="brand">{{data_1}}</span>
					<span class="product">{{data_5}}</span>
					<div class="md_prd_price">
						<span class="discount">{{data_6}}</span>
						<span class="current">{{data_7}}</span>
					</div>
				</div>
			</a>
		</li>
	</ul>
</div></textarea>
                    </div>
                    <div class="template-save-control">
                        <span>커스텀 템플릿 저장:</span>
                        <select id="saveTemplateTarget">
                            <option value="" disabled selected>추가된 커스텀 템플릿 없음</option>
                        </select>
                        <button type="button" id="btnSaveTemplate" class="btn btn-primary" disabled>저장하기</button>
                    </div>
                </div>

                <div class="excel-parser-section">
                    <div class="panel-header parser-header">
                        <h2>행 Data 정리</h2>
                        <div class="parser-mode-selectors">
                            <label for="patternPeriod">몇열? :</label>
                            <input type="number" id="patternPeriod" value="3" min="1" max="20" style="width: 50px; text-align: center;">
                        </div>
                    </div>
                    <div class="parser-container">
                        <div class="parser-input-wrapper">
                            <textarea id="excelGridInput" placeholder="여기에 엑셀 격자 데이터를 복사해서 붙여넣으세요. (예: 1위 브랜드 상품 품번이 포함된 표 데이터 전체 복사)"></textarea>
                        </div>
                        <div id="parserOutputContainer" class="parser-output-container hidden">
                            <div class="parser-output-header">
                                <span>정리된 데이터 결과</span>
                                <button id="btnParserClear">지우기</button>
                            </div>
                            <div id="parserResultsList" class="parser-results-list"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Data Input (Column Based) -->
            <section class="panel right-panel">
                <div class="panel-header">
                    <h2>Excel Data (열 단위 입력)</h2>
                    <span class="tip">엑셀에서 '열' 단위로 복사해서 각 항목에 붙여넣으세요.</span>
                </div>

                <!-- ========== Default Form (브랜드 정보 + 상품 탭) ========== -->
                <div id="form-default" class="form-section">
                    <!-- Tabs -->
                    <div class="tabs" id="tabsContainer">
                        <button class="tab-btn active" data-tab="tab-brand">브랜드 정보</button>
                        <button class="tab-btn" data-tab="tab-prod1">상품 1</button>
                        <button id="btnAddProduct" class="tab-btn-add">+</button>
                    </div>

                    <div class="editor-container column-inputs" id="tabContentsContainer">
                        <!-- Brand Tab -->
                        <div id="tab-brand" class="tab-content active">
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="brandName" data-prev="data_1"
                                        value="data_1">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colBrandName" placeholder="data_1 열 붙여넣기"></textarea>
                            </div>
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="brandLanding"
                                        data-prev="data_2" value="data_2">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colBrandLanding" placeholder="data_2 열 붙여넣기"></textarea>
                            </div>
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="brandDisc" data-prev="data_3"
                                        value="data_3">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colBrandDisc" placeholder="data_3 열 붙여넣기"></textarea>
                            </div>
                        </div>

                        <!-- Product 1 Tab -->
                        <div id="tab-prod1" class="tab-content">
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="code" data-prev="data_4"
                                        value="data_4">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colP1Code" placeholder="data_4 열 붙여넣기"></textarea>
                            </div>
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="name" data-prev="data_5"
                                        value="data_5">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colP1Name" placeholder="data_5 열 붙여넣기"></textarea>
                            </div>
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="disc" data-prev="data_6"
                                        value="data_6">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colP1Disc" placeholder="data_6 열 붙여넣기"></textarea>
                            </div>
                            <div class="col-group">
                                <div class="label-group">
                                    <input type="text" class="editable-label" data-field="price" data-prev="data_7"
                                        value="data_7">
                                    <button class="btn-save-label" title="저장">저장</button>
                                </div>
                                <textarea id="colP1Price" placeholder="data_7 열 붙여넣기"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Custom Template Columns Form (dynamically rendered by JS) -->
                <div id="customColumnsContainer" class="custom-columns-form hidden"></div>

            </section>

        </main>

        <!-- Output Modal (Hidden by default) -->
        <div id="outputModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>변환 결과 (Result)</h2>
                    <div class="modal-actions">
                        <span id="copyMessage" class="success-msg hidden">복사되었습니다!</span>
                        <button id="btnCopy" class="btn btn-primary">결과 복사</button>
                        <button id="btnCloseModal" class="btn btn-secondary">닫기</button>
                    </div>
                </div>
                <textarea id="outputResult" readonly></textarea>
            </div>
        </div>
    </div>

    <!-- Custom Template Name Dialog -->
    <div id="templateNameDialog" class="tpl-dialog-overlay hidden">
        <div class="tpl-dialog">
            <div class="tpl-dialog-header">
                <h3>새 커스텀 템플릿 추가</h3>
            </div>
            <div class="tpl-dialog-body">
                <label for="templateNameInput">템플릿 이름</label>
                <input type="text" id="templateNameInput" placeholder="예: 브랜드 슬라이더, 상품 리스트..." autocomplete="off">
                <label>데이터 컬럼 수</label>
                <div class="tpl-col-count-row">
                    <button type="button" id="btnColCountMinus" class="btn-col-count">−</button>
                    <input type="number" id="templateColumnCount" value="3" min="1" max="20">
                    <button type="button" id="btnColCountPlus" class="btn-col-count">+</button>
                    <span class="tpl-col-count-hint">개의 data_N 입력란</span>
                </div>
            </div>
            <div class="tpl-dialog-footer">
                <button type="button" id="btnTemplateNameCancel" class="btn btn-secondary">취소</button>
                <button type="button" id="btnTemplateNameConfirm" class="btn btn-primary">추가</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js?v=2"></script>
    <script src="js/parser.js"></script>
    <script src="js/template.js"></script>
    <script src="js/app.js?v=8"></script>
</body>

</html>
